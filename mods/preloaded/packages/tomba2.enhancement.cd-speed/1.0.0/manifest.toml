format_version = 5
id = "tomba2.enhancement.cd-speed"
version = "1.0.0"
name = "Tomba 2 CD Speed"
author = "mstan"
description = "Emulated CD drive speed. Shortens loads without speeding the game up, so it does not disturb movement or timing-based routes."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94454"
disc_sha256 = "8e9568388155787384c3166a5934a495fbff3fa57154ab0489b0f214fe05a8ab"

[[feature]]
id = "cd-speed"
name = "CD Speed"
description = "Disabled by default. Divides the emulated sector delay, so the drive delivers data sooner while the game itself continues to run at normal speed. Unlike host pacing this changes WHEN the game receives CD interrupts, so a high value can expose timing bugs -- raise it gradually and back off if a load stalls. FMV and CD audio always keep authentic timing."
group = "Quality of Life"
default_enabled = false

[[option]]
feature = "cd-speed"
id = "multiplier"
label = "CD speed multiplier"
description = "1 is authentic 1x. Try 2-32; higher is faster but likelier to trip a timing bug. Any positive value is accepted so you can find this game's limit. Ignored while Instant is ticked."
group = "Quality of Life"
type = "integer"
min = 1
max = 1024
step = 1
default = 4
disabled_by = "instant"

[[option]]
feature = "cd-speed"
id = "instant"
label = "Instant (bounded scheduler)"
description = "Deliver sectors as fast as the bounded instant scheduler allows instead of using a multiplier. This is the fastest and the riskiest setting."
group = "Quality of Life"
type = "boolean"
default = "false"

[[option]]
feature = "cd-speed"
id = "instant_budget"
label = "Instant sectors per frame"
description = "How many sectors the instant scheduler may deliver per frame. Lower is gentler on games that dislike bursts. Only used while Instant is ticked."
group = "Quality of Life"
type = "integer"
min = 1
max = 256
step = 1
default = 32

[[plugin]]
feature = "cd-speed"
id = "tomba2.cd-speed"
